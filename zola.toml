minify_html = false

# The URL the site will be built for
base_url = "https://helmholtz-blog.hwatson.workers.dev"

title = "Helmholtz W."
description = "Systems, markets, machines, and other notes."
default_language = "en"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Categories are used internally by the homepage and library.
# render = false prevents Zola from generating separate taxonomy pages.
taxonomies = [
    { name = "categories", render = false, feed = false },
]

